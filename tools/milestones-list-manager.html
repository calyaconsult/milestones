<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eintragsliste verwalten</title>
<style>
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --danger: #dc2626;
    --danger-hover: #b91c1c;
    --border: #d1d5db;
    --text: #111827;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 2rem 1rem;
  }
  .container { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 1.5rem; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.25rem;
    margin-bottom: 1.5rem;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: .3rem; }
  input[type="date"], input[type="text"], textarea {
    width: 100%;
    padding: .55rem .7rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: .95rem;
    font-family: inherit;
    margin-bottom: 1rem;
  }
  textarea { resize: vertical; min-height: 80px; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .btn-row { display: flex; flex-wrap: wrap; gap: .5rem; }
  button {
    padding: .55rem 1rem;
    border: none;
    border-radius: 6px;
    font-size: .9rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { background: var(--danger-hover); }
  .btn-neutral { background: #e5e7eb; color: var(--text); }
  .btn-neutral:hover { background: #d1d5db; }
  .item {
    display: flex;
    align-items: flex-start;
    gap: .75rem;
    padding: .75rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: .6rem;
    cursor: pointer;
  }
  .item.selected { border-color: var(--accent); background: #eff6ff; }
  .item input[type="radio"] { margin-top: .3rem; }
  .item .meta { font-size: .8rem; color: var(--muted); margin-bottom: .15rem; }
  .item .title { font-weight: 700; }
  .item .text { font-size: .9rem; margin-top: .2rem; }
  .empty { color: var(--muted); font-style: italic; }
  #status { font-size: .85rem; color: var(--muted); margin-top: .75rem; min-height: 1.2em; }
</style>
<base target="_blank">
</head>
<body>
<div class="container">
  <h1>📋 Eintragsliste verwalten</h1>

  <div class="card">
    <form id="item-form">
      <label for="f-date">Datum</label>
      <input type="date" id="f-date" required>

      <label for="f-title">Titel</label>
      <input type="text" id="f-title" required maxlength="200">

      <label for="f-text">Text</label>
      <textarea id="f-text" required></textarea>

      <div class="btn-row">
        <button type="submit" class="btn-primary">➕ add new item</button>
        <button type="button" class="btn-danger" id="btn-delete">🗑️ delete item</button>
        <button type="button" class="btn-neutral" id="btn-reset">↺ reset list</button>
      </div>
    </form>
  </div>

  <div class="card">
    <h2 style="font-size:1.05rem;margin-top:0;">Aktuelle Einträge (<span id="count">0</span>)</h2>
    <div id="list"></div>
  </div>

  <div class="card">
    <div class="btn-row">
      <button type="button" class="btn-neutral" id="btn-json">⬇ export JSON</button>
      <button type="button" class="btn-neutral" id="btn-yaml">⬇ export YAML</button>
      <button type="button" class="btn-neutral" id="btn-csv">⬇ export CSV</button>
    </div>
    <div id="status"></div>
  </div>
</div>

<script>
const STORAGE_KEY = "itemsList";
const DEFAULT_ITEMS = [
  {
   "date": "2026-09-23",
   "title": "Herbstanfang es bleiben 99 Tage bis Neujahr",
   "text": "Wer noch nicht mit der Vorbereitung auf die Weihnachtssaison begonnen hat, muss es spätestens jetzt tun."
  },
  {
   "date": "2026-10-01",
   "title": "1. Oktober",
   "text": "Das letzte Quartal des Jahres beginnt. Für viele Firmen ist es das umsatzstärkste."
  },
  {
   "date": "2026-10-31",
   "title": "Halloween",
   "text": "Ab hier befinden wir uns in der Hauptphase des vorweihnachtlichen Geschäfts."
  },
  {
   "date": "2026-11-11",
   "title": "Halbzeit noch 50 Tage!",
   "text": "Bis Weihnachten bleiben 6 Wochen, bis Neujahr 7."
  },
  {
   "date": "2026-11-27",
   "title": "Black Friday",
   "text": "Der grosse Shopping-Tag mit Aktionen und Sonderangeboten."
  },
  {
   "date": "2026-11-29",
   "title": "Erster Adventssonntag",
   "text": "Am Dienstag darauf wird das erste Türchen des Adventskalenders geöffnet. Die heisse Endphase beginnt."
  },
  {
   "date": "2026-12-06",
   "title": "St. Nikolaus",
   "text": "Vor allem für Bäckereien, Konditoreien und Lebensmittelgeschäfte sehr umsatzstark."
  },
  {
   "date": "2026-12-21",
   "title": "Vierter Adventssonntag, Wintersonnwende",
   "text": "Der dunkelste Tag des Jahres. In drei Tagen beginnt das Fest des wiederkehrenden Lichts."
  },
  {
   "date": "2026-12-25",
   "title": "Weihnachten",
   "text": "Es ist geschafft. Feiern Sie fröhlich und geniessen Sie die letzten Tage des Jahres."
  },
  {
   "date": "2026-12-31",
   "title": "Silvester",
   "text": "Das Jahr 2026 endet."
  },
  {
   "date": "2027-01-01",
   "title": "Neujahr",
   "text": "Wir begrüssen das Jahr 2027. Möge es ein glückliches werden."
  }
];

let items = load();
let selectedIndex = null;

function load() {
  let result;
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw === null) result = JSON.parse(JSON.stringify(DEFAULT_ITEMS));
    else {
      const parsed = JSON.parse(raw);
      result = Array.isArray(parsed) ? parsed : JSON.parse(JSON.stringify(DEFAULT_ITEMS));
    }
  } catch (e) {
    result = JSON.parse(JSON.stringify(DEFAULT_ITEMS));
  }
  return sortByDate(result);
}

function sortByDate(list) {
  // ISO-Daten (YYYY-MM-DD) lassen sich als Strings vergleichen
  list.sort((a, b) => String(a.date).localeCompare(String(b.date)));
  return list;
}

function save() {
  sortByDate(items);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
}

function render() {
  const listEl = document.getElementById("list");
  document.getElementById("count").textContent = items.length;
  listEl.innerHTML = "";
  if (items.length === 0) {
    listEl.innerHTML = '<p class="empty">Keine Einträge vorhanden.</p>';
    return;
  }
  items.forEach((item, i) => {
    const div = document.createElement("div");
    div.className = "item" + (i === selectedIndex ? " selected" : "");
    div.innerHTML =
      '<input type="radio" name="sel" ' + (i === selectedIndex ? "checked" : "") + '>' +
      '<div>' +
        '<div class="meta">' + escapeHtml(item.date) + '</div>' +
        '<div class="title">' + escapeHtml(item.title) + '</div>' +
        '<div class="text">' + escapeHtml(item.text) + '</div>' +
      '</div>';
    div.addEventListener("click", () => {
      selectedIndex = (selectedIndex === i) ? null : i;
      render();
    });
    listEl.appendChild(div);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function setStatus(msg) {
  const el = document.getElementById("status");
  el.textContent = msg;
  clearTimeout(setStatus._t);
  setStatus._t = setTimeout(() => { el.textContent = ""; }, 4000);
}

// Formular: neuer Eintrag
document.getElementById("item-form").addEventListener("submit", (e) => {
  e.preventDefault();
  const item = {
    date: document.getElementById("f-date").value,
    title: document.getElementById("f-title").value.trim(),
    text: document.getElementById("f-text").value.trim()
  };
  if (!item.date || !item.title || !item.text) return;
  items.push(item);
  save();
  e.target.reset();
  selectedIndex = null;
  render();
  setStatus("Eintrag hinzugefügt.");
});

// Löschen (ausgewählter Eintrag)
document.getElementById("btn-delete").addEventListener("click", () => {
  if (selectedIndex === null) {
    setStatus("Bitte zuerst einen Eintrag in der Liste auswählen.");
    return;
  }
  items.splice(selectedIndex, 1);
  selectedIndex = null;
  save();
  render();
  setStatus("Eintrag gelöscht.");
});

// Zurücksetzen
document.getElementById("btn-reset").addEventListener("click", () => {
  if (!confirm("Wirklich die gesamte Liste auf den Ausgangszustand zurücksetzen?")) return;
  items = JSON.parse(JSON.stringify(DEFAULT_ITEMS));
  selectedIndex = null;
  save();
  render();
  setStatus("Liste zurückgesetzt.");
});

// ---------- Export ----------
function download(filename, content, mime) {
  const blob = new Blob([content], { type: mime + ";charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function csvEscape(v) {
  const s = String(v ?? "");
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

// Einfacher YAML-Serialisierer für dieses flache Datenformat
function toYAML(list) {
  const quote = (s) => {
    const str = String(s ?? "");
    if (/[:#\[\]{},&*?]|^[\s'"!%@`>-]|[\n\r]|^\s|\s$|^(true|false|null|yes|no|on|off)$/i.test(str) || /^\d{4}-\d{2}-\d{2}$/.test(str)) {
      return JSON.stringify(str);
    }
    return str;
  };
  return list.map(item =>
    "- date: " + quote(item.date) + "\n" +
    "  title: " + quote(item.title) + "\n" +
    "  text: " + quote(item.text)
  ).join("\n") + "\n";
}

document.getElementById("btn-json").addEventListener("click", () => {
  download("milestones.json", JSON.stringify(items, null, 2), "application/json");
  setStatus("JSON exportiert.");
});

document.getElementById("btn-yaml").addEventListener("click", () => {
  download("milestones.yaml", toYAML(items), "application/x-yaml");
  setStatus("YAML exportiert.");
});

document.getElementById("btn-csv").addEventListener("click", () => {
  const header = "date,title,text";
  const rows = items.map(i => [i.date, i.title, i.text].map(csvEscape).join(","));
  download("milestones.csv", header + "\n" + rows.join("\n") + "\n", "text/csv");
  setStatus("CSV exportiert.");
});

// Init
save(); // sicherstellen, dass der Ausgangszustand gespeichert ist
render();
</script>
</body>
</html>
